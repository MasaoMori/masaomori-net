title: "Data Science & Institutional Research"
description: "大学IR実務家・研究者 森 雅生のブログ"
url: "https://masaomori.net"
baseurl: ""
lang: ja
timezone: Asia/Tokyo
encoding: utf-8
permalink: /:title/
future: false
strict_front_matter: true
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - .github
  - .bundle
  - node_modules
  - migration
  - preview
include:
  - _pages

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: ja
      searchable: true
      content_type: post
