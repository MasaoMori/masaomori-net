<div class="article-list"><article class="article-summary"><time>2015-06-11</time><h2><a href="{{ "/%E5%AD%A6%E6%A0%A1%E5%9F%BA%E6%9C%AC%E8%AA%BF%E6%9F%BB%E3%81%AE%E3%83%87%E3%83%BC%E3%82%BF%E3%81%A7%E5%A4%A7%E5%AD%A6%E6%AF%94%E8%BC%83/" | relative_url }}">学校基本調査のデータで大学比較</a></h2><p>平成24年度の学校基本調査（大学）が公開されています。東京大学の船守美穂先生による分析が特に有名ですが、分析の視点や比較対象を選んでリアルタイムでベンチマークしたいですよね。そこで、こんなの作りました。 大学比較 分析の視点は、教員職位比率、志願倍率、女性教員比率、外国人教員比率…</p><a class="read-more" href="{{ "/%E5%AD%A6%E6%A0%A1%E5%9F%BA%E6%9C%AC%E8%AA%BF%E6%9F%BB%E3%81%AE%E3%83%87%E3%83%BC%E3%82%BF%E3%81%A7%E5%A4%A7%E5%AD%A6%E6%AF%94%E8%BC%83/" | relative_url }}">続きを読む →</a></article></div>
